name: Tests
on:
  push:
    branches: [improve/ux-visual-audit, feat/commercial-platform-foundation]
  pull_request:
    branches: [claude/new-session-gjpwc5]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: courses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d courses_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase Auth compatibility layer
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d courses_test -v ON_ERROR_STOP=1 -f tests/db/bootstrap.sql
      - name: Apply platform migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d courses_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611120001_initial_schema.sql
          psql -h localhost -U postgres -d courses_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611120002_harden_rls.sql
      - name: Verify row-level security and access rules
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d courses_test -v ON_ERROR_STOP=1 -f tests/db/verify.sql
