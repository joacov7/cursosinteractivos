name: Tests

on:
  push:
    branches:
      - improve/ux-visual-audit
      - feat/platform-fastapi-foundation
  pull_request:
    branches:
      - improve/ux-visual-audit

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: courses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d courses_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/courses_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply all migrations
        run: alembic upgrade head
      - name: Exercise authentication against PostgreSQL
        run: PYTHONPATH=. pytest -q
      - name: Verify schema can be rolled back
        run: alembic downgrade base
      - name: Verify schema can be applied again
        run: alembic upgrade head
